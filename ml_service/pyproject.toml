[project]
name = "tender-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "requests>=2.31,<3",
  "qdrant-client>=1.10,<2",
  "pymupdf4llm>=0.0.17,<1",
  "numpy>=2,<3",
  "flashrank>=0.2.10",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
