# Analytics stack: Postgres <- analytics (Go) <- frontend, and in parallel
# Postgres <- Metabase (for dashboards/charts).
#
# The main TenderHack backend (auth/tickets/employees) is a separate service
# not included in this archive — point frontend's VITE_API_URL at it
# separately (see frontend/README.md).
#
# Usage:
#   docker compose up -d postgres analytics metabase
#   # then open Metabase at http://localhost:3000, connect it to the same
#   # Postgres instance, and enable static embedding for the dashboards you
#   # create (see analytics/README.md).
#   docker compose up -d frontend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-postgres}}
      POSTGRES_DB: ${DB_NAME:-tender-hack}
    ports:
      - '5433:5432'
    volumes:
      - tenderhack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tender-hack"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.29.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://postgres:5432/tender-hack
      - LIQUIBASE_COMMAND_USERNAME=postgres
      - LIQUIBASE_COMMAND_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD:-postgres}}
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=changelog_master.yml
      - LIQUIBASE_SEARCH_PATH=/changelog
    volumes:
      - ./db/migrations:/changelog
    command: update

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-${DB_PASSWORD:-postgres}}@postgres:5432/tender-hack
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_URL: ${AI_URL:-}
      AI_MODE: ${AI_MODE:-http}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-false}
      DEMO_SEED: ${DEMO_SEED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-420}
      MODERATION_URL: http://moderation:8003/check
      MODERATION_API_KEY: ${MODERATION_API_KEY:-${AI_API_KEY:-}}
      MODERATION_TIMEOUT: ${MODERATION_TIMEOUT:-2}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10

  moderation:
    build: ./moderation_service
    restart: unless-stopped
    environment:
      MODERATION_API_KEY: ${MODERATION_API_KEY:-${AI_API_KEY:-}}
      MODERATION_THREADS: "2"
      OBSCENITY_THRESHOLD: ${OBSCENITY_THRESHOLD:-0.95}
    volumes:
      - ${MODERATION_MODEL_PATH:-./.demo/models/moderation}:/model:ro
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  qdrant:
    profiles: [ml]
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  tei:
    profiles: [ml]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    volumes:
      - tei_data:/data
    command: ["--model-id", "BAAI/bge-m3", "--port", "80"]

  llm:
    profiles: [ml]
    image: ghcr.io/ggml-org/llama.cpp:server-b9265
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - ${QWEN_MODEL_PATH:-./.demo/models/qwen/Qwen2.5-7B-Instruct-Q4_K_M.gguf}:/models/qwen.gguf:ro
    command:
      - --model
      - /models/qwen.gguf
      - --alias
      - qwen2.5-7b-instruct
      - --alias
      - local-qwen
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --timeout
      - "420"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
      - --threads
      - "8"
      - --threads-batch
      - "8"
      - --jinja
      - --chat-template-kwargs
      - '{"enable_thinking": false}'

  ml:
    profiles: [ml]
    build: ./ml_service
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      TEI_BASE_URL: http://tei:80
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://llm:8002/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      MODEL_NAME: ${MODEL_NAME:-qwen2.5-7b-instruct}
      ML_API_KEY: ${AI_API_KEY:-}
      EMBEDDING_PREFIX: ""
      COLLECTION_L1: kb_support
      COLLECTION_L2: kb_support
      SCORE_THRESHOLD: "0.50"
      REQUEST_TIMEOUT: "240"
      KB_PATH: /knowledge/dense_kb_v1
    volumes:
      - ${MANUALS_PATH:-./.demo/knowledge}:/knowledge:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - qdrant
      - tei
      - llm
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  analytics:
    build:
      context: ./analytics
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-postgres}}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:-tender-hack}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # Metabase integration — all optional; dashboards still save without
      # them, widgets just won't render until these are set (see
      # analytics/README.md for how to obtain each value).
      METABASE_URL: ${METABASE_URL:-}
      METABASE_API_KEY: ${METABASE_API_KEY:-}
      METABASE_EMBEDDING_SECRET: ${METABASE_EMBEDDING_SECRET:-}
      METABASE_DATABASE_ID: ${METABASE_DATABASE_ID:-}
    ports:
      - '8080:8080'

  # Metabase is a fully separate service — the frontend never starts it and
  # never talks to Postgres directly; it only calls the analytics backend
  # and Metabase's embed endpoints.
  metabase:
    image: metabase/metabase:v0.56.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: '5432'
      MB_DB_USER: ${DB_USER:-postgres}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-postgres}}
      # Metabase's OWN application database. Using a separate logical DB
      # keeps Metabase's internal tables out of the analytics schema; create
      # it once with: CREATE DATABASE metabase_app;
      MB_DB_DBNAME: ${METABASE_APP_DB_NAME:-metabase_app}
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
      # VITE_* variables are baked in at BUILD time by Vite — a running
      # nginx container serving a static build cannot pick up `environment:`
      # changes, so they must be passed as build args instead.
      args:
        VITE_APP_MODE: ${VITE_APP_MODE:-api}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ANALYTICS_API_URL: ${VITE_ANALYTICS_API_URL:-}
        VITE_METABASE_URL: ${VITE_METABASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - analytics
      - backend
    ports:
      - '80:80'
      - '5173:80'

volumes:
  tenderhack_postgres_data:
  qdrant_data:
  tei_data:

