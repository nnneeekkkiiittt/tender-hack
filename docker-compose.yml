# Analytics stack: Postgres <- analytics (Go) <- frontend, and in parallel
# Postgres <- Metabase (for dashboards/charts).
#
# The main TenderHack backend (auth/tickets/employees) is a separate service
# not included in this archive — point frontend's VITE_API_URL at it
# separately (see frontend/README.md).
#
# Usage:
#   docker compose up -d postgres analytics metabase
#   # then open Metabase at http://localhost:3000, connect it to the same
#   # Postgres instance, and enable static embedding for the dashboards you
#   # create (see analytics/README.md).
#   docker compose up -d frontend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tender-hack}
    ports:
      - '5433:5433'
    volumes:
      - tenderhack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  analytics:
    build:
      context: ./analytics
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: '5433'
      DB_NAME: ${DB_NAME:-tender-hack}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Metabase integration — all optional; dashboards still save without
      # them, widgets just won't render until these are set (see
      # analytics/README.md for how to obtain each value).
      METABASE_URL: ${METABASE_URL:-}
      METABASE_API_KEY: ${METABASE_API_KEY:-}
      METABASE_EMBEDDING_SECRET: ${METABASE_EMBEDDING_SECRET:-}
      METABASE_DATABASE_ID: ${METABASE_DATABASE_ID:-}
    ports:
      - '8080:8080'

  # Metabase is a fully separate service — the frontend never starts it and
  # never talks to Postgres directly; it only calls the analytics backend
  # and Metabase's embed endpoints.
  metabase:
    image: metabase/metabase:v0.56.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: '5433'
      MB_DB_USER: ${DB_USER:-postgres}
      MB_DB_PASS: ${DB_PASSWORD:-postgres}
      # Metabase's OWN application database. Using a separate logical DB
      # keeps Metabase's internal tables out of the analytics schema; create
      # it once with: CREATE DATABASE metabase_app;
      MB_DB_DBNAME: ${METABASE_APP_DB_NAME:-metabase_app}
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
      # VITE_* variables are baked in at BUILD time by Vite — a running
      # nginx container serving a static build cannot pick up `environment:`
      # changes, so they must be passed as build args instead.
      args:
        VITE_APP_MODE: ${VITE_APP_MODE:-api}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ANALYTICS_API_URL: ${VITE_ANALYTICS_API_URL:-http://localhost:8080}
        VITE_METABASE_URL: ${VITE_METABASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - analytics
      - backend
    ports:
      - '5173:80'

volumes:
  tenderhack_postgres_data:
