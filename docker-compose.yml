services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tender-hack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tender-hack"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.29.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://postgres:5432/tender-hack
      - LIQUIBASE_COMMAND_USERNAME=postgres
      - LIQUIBASE_COMMAND_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=changelog_master.yml
      - LIQUIBASE_SEARCH_PATH=/changelog
    volumes:
      - ./db/migrations:/changelog
    command: update

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/tender-hack
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_URL: ${AI_URL:-}
      AI_MODE: ${AI_MODE:-http}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-false}
      DEMO_SEED: ${DEMO_SEED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-420}
    depends_on:
      liquibase:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    profiles: [ml]
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  tei:
    profiles: [ml]
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:e0918e6fc9020c7fcef8733f4191f6bffe2f5be44c1e409658be3244dfaf1231
    restart: unless-stopped
    volumes:
      - tei_data:/data
      - ${E5_MODEL_PATH:-./.demo/models/e5}:/model:ro
    environment:
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "4"
    command: ["--model-id", "/model", "--port", "80", "--max-client-batch-size", "32"]

  llm:
    profiles: [ml]
    image: ghcr.io/ggml-org/llama.cpp:server-b9265
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - ${QWEN_MODEL_PATH:-./.demo/models/qwen/Qwen3-4B-Q4_K_M.gguf}:/models/qwen.gguf:ro
    command:
      - --model
      - /models/qwen.gguf
      - --alias
      - local-qwen
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --timeout
      - "420"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
      - --threads
      - "8"
      - --threads-batch
      - "8"
      - --jinja
      - --chat-template-kwargs
      - '{"enable_thinking": false}'

  ml:
    profiles: [ml]
    build: ./ml_service
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      TEI_BASE_URL: http://tei:80
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://llm:8002/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      MODEL_NAME: ${MODEL_NAME:-local-qwen}
      ML_API_KEY: ${AI_API_KEY:-}
      EMBEDDING_PREFIX: "query: "
      COLLECTION_L1: manuals_e5_v1
      COLLECTION_L2: manuals_e5_v1
      SCORE_THRESHOLD: "0.82"
      REQUEST_TIMEOUT: "240"
      KB_PATH: /knowledge/dense_kb_v1
    volumes:
      - ${MANUALS_PATH:-./.demo/knowledge}:/knowledge:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - qdrant
      - tei
      - llm
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
  analytics:
    profiles: [analytics]
    build:
      context: ./analytics
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8081}:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=tender-hack
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully

volumes:
  postgres_data:
  qdrant_data:
  tei_data:
