[project]
name = "tender-operational"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
